    var dirty = new WeakMap();
    var hasUserInvalid = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('selector(:user-invalid)');

    function syncField(el) {
      if (!el.matches || !el.matches('input, select, textarea') || el.type === 'radio' || el.type === 'file') return;
      var st = dirty.get(el);
      var invalid = hasUserInvalid ? el.matches(':user-invalid') : Boolean(st && st.blurred && !el.validity.valid);
      if (!hasUserInvalid && st && st.blurred) {
        el.classList.toggle('user-invalid-fallback', !el.validity.valid);
        el.classList.toggle('user-valid-fallback', el.validity.valid);
      }
      el.setAttribute('aria-invalid', invalid ? 'true' : 'false');
    }

    function wireA11y(formEl) {
      formEl.querySelectorAll('input:not([type="radio"]):not([type="file"]), select, textarea').forEach(syncField);
      formEl.addEventListener('blur', function (e) { dirty.set(e.target, { blurred: true }); syncField(e.target); }, true);
      formEl.addEventListener('input', function (e) { if (e.target.hasAttribute('aria-invalid')) syncField(e.target); });
      formEl.addEventListener('invalid', function (e) { dirty.set(e.target, { blurred: true }); syncField(e.target); }, true);
    }
    wireA11y(regForm);
    wireA11y(memForm);

    function wireFile(inputEl, previewId, store, key) {
      var prev = document.getElementById(previewId);
      var wrap = inputEl.closest('.bu-file-wrap');
      inputEl.addEventListener('change', function () {
        if (wrap) wrap.classList.remove('has-error');
        var file = inputEl.files && inputEl.files[0];
        if (!file) { store[key] = null; prev.hidden = true; return; }
        if (file.size > MAX_BYTES) {
          store[key] = null;
          inputEl.value = '';
          if (wrap) wrap.classList.add('has-error');
          prev.hidden = false;
          prev.style.color = '#b91c1c';
          prev.textContent = 'File exceeds ' + ICFI_STAFF_CONFIG.maxUploadMb + ' MB limit.';
          return;
        }
        var reader = new FileReader();
        reader.onload = function () {
          var res = String(reader.result || '');
          store[key] = { name: file.name, mimeType: file.type || 'application/octet-stream', size: file.size, base64: res.split(',')[1] || res };
          prev.hidden = false;
          prev.style.color = '#047857';
          prev.textContent = 'Attached: ' + file.name + ' (' + Math.max(1, Math.round(file.size / 1024)) + ' KB)';
        };
        reader.readAsDataURL(file);
      });
    }

    var regFiles = { membershipProof: null, paymentReceipt: null };
    var memFiles = { paymentEvidence: null };
    wireFile(document.getElementById('bu-reg-mem-file'), 'bu-prev-mem-file', regFiles, 'membershipProof');
    wireFile(document.getElementById('bu-reg-rec-file'), 'bu-prev-rec-file', regFiles, 'paymentReceipt');
    wireFile(document.getElementById('bu-mem-file'), 'bu-prev-m-file', memFiles, 'paymentEvidence');

    function validateStep(formEl, stepEl, files) {
      var first = null;
      stepEl.querySelectorAll('[data-group-required]').forEach(function (g) {
        var ok = Boolean(formEl.querySelector('input[name="' + g.dataset.groupRequired + '"]:checked'));
        g.classList.toggle('has-error', !ok);
        if (!ok && !first) first = g.querySelector('input');
      });
      stepEl.querySelectorAll('input[type="file"]').forEach(function (f) {
        if (f.closest('[hidden]')) return;
        var ok = !f.required || Boolean(files[f.name]);
        var w = f.closest('.bu-file-wrap');
        if (w) w.classList.toggle('has-error', !ok);
        if (!ok && !first) first = f;
      });
      stepEl.querySelectorAll('input:not([type="radio"]):not([type="file"]), select, textarea').forEach(function (el) {
        if (el.closest('[hidden]')) return;
        if (!el.checkValidity()) { dirty.set(el, { blurred: true }); syncField(el); if (!first) first = el; }
      });
      if (first) { first.focus(); announcer.textContent = 'Please check highlighted required fields.'; return false; }
      return true;
    }

    window.buIcfiOpenTab = function (tab) {
      var isMem = tab === 'membership';
      document.getElementById('bu-tab-conf').setAttribute('aria-selected', String(!isMem));
      document.getElementById('bu-tab-mem').setAttribute('aria-selected', String(isMem));
      document.getElementById('bu-panel-conf').hidden = isMem;
      document.getElementById('bu-panel-mem').hidden = !isMem;
      document.getElementById('bu-icfi-portal').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
    };

    function getRadio(formEl, name) {
      var c = formEl.querySelector('input[name="' + name + '"]:checked');
      return c ? c.value : '';
    }

    /* --- Fee & Bank Calculator --- */
    function computePricing() {
      var cat = getRadio(regForm, 'participantCategory');
      var mode = getRadio(regForm, 'participationMode');
      var mem = getRadio(regForm, 'membershipStatus');
      var early = Date.now() <= EARLY_BIRD_MS;
      var period = early ? 'Early Bird' : 'Standard';
      var isLocal = cat.indexOf('Local') === 0;
      var isIntl = cat.indexOf('International') === 0;
      var cur = isIntl ? 'USD' : 'NGN';
      var acct = isIntl ? '0829898610' : '1020069501';
      var bank = isIntl ? 'GTBank • B.U-Op./Inst. For Faith Integr (USD: 0829898610)' : 'UBA Plc • Babcock MFB (NGN: 1020069501)';
      var fee = 'Select options';
      var note = 'Choose category, mode & membership.';
      if ((isLocal || isIntl) && mode) {
        if (mode === 'Virtual / Online') {
          fee = isLocal ? '₦25,000' : '$50';
          note = (isLocal ? 'Local' : 'International') + ' • Virtual / Online';
        } else if (early || mem === 'Registered Member') {
          fee = isLocal ? '₦40,000' : '$80';
          note = (isLocal ? 'Local' : 'International') + ' • In-person (' + (mem === 'Registered Member' ? 'Member Rate' : 'Early Bird') + ')';
        } else {
          fee = isLocal ? '₦50,000' : '$100';
          note = (isLocal ? 'Local' : 'International') + ' • In-person (Standard Fee)';
        }
      }
      return { cat: cat, mode: mode, mem: mem, period: period, isLocal: isLocal, isIntl: isIntl, cur: cur, acct: acct, bank: bank, fee: fee, note: note };
    }

    function syncRegUI() {
      var p = computePricing();
      var proofBox = document.getElementById('bu-mem-proof-box');
      proofBox.hidden = p.mem !== 'Registered Member';
      document.getElementById('bu-reg-mem-file').required = p.mem === 'Registered Member';
      document.getElementById('bu-mem-join-box').hidden = p.mem !== 'New Member Applicant';
      var cInput = document.getElementById('bu-r-country');
      if (p.isLocal && !cInput.dataset.edited) cInput.value = 'Nigeria';
      document.getElementById('bu-sum-period').textContent = p.period;
      document.getElementById('bu-sum-amount').textContent = p.fee;
      document.getElementById('bu-sum-note').textContent = p.note;
      document.getElementById('bu-sum-bank').textContent = p.cat ? p.bank : 'UBA Plc (NGN: 1020069501) or GTBank (USD: 0829898610)';
      document.getElementById('bu-pay-summary').textContent = p.cat && p.mode ? p.fee + ' — ' + p.note : 'Select options in Step 1';
      document.getElementById('bu-pay-acct').textContent = p.bank;
      var amt = document.getElementById('bu-r-amt');
      if (p.fee !== 'Select options' && !amt.dataset.edited) amt.value = p.fee;
    }

    document.getElementById('bu-r-country').addEventListener('input', function (e) { e.target.dataset.edited = '1'; });
    document.getElementById('bu-r-amt').addEventListener('input', function (e) { e.target.dataset.edited = '1'; });
    regForm.querySelectorAll('input[type="radio"]').forEach(function (r) {
      r.addEventListener('change', function () {
        var g = r.closest('.bu-choice-group');
        if (g) g.classList.remove('has-error');
        syncRegUI();
      });
    });

    function setPills(selector, attr, active) {
      document.querySelectorAll(selector).forEach(function (el) {
        var n = Number(el.getAttribute(attr));
        el.classList.toggle('is-done', n < active);
        if (n === active) el.setAttribute('aria-current', 'step');
        else el.removeAttribute('aria-current');
      });
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.buIcfiRegGo = function (step) {
      regForm.querySelectorAll('[data-reg-step]').forEach(function (s) { s.hidden = Number(s.dataset.regStep) !== step; });
      setPills('[data-reg-pill]', 'data-reg-pill', step);
      if (step === 4) {
        var p = computePricing();
        var rows = [['Category', p.cat], ['Mode', p.mode], ['Fee', p.fee], ['Membership', p.mem], ['Name', regForm.fullName.value], ['Email', regForm.email.value], ['Amount', regForm.amountPaid.value], ['Receipt', regFiles.paymentReceipt ? regFiles.paymentReceipt.name : '—']];
        document.getElementById('bu-reg-review').innerHTML = rows.map(function (kv) {
          return '<div><div style="font-size:10px; font-weight:700; text-transform:uppercase; color:var(--bu-muted);">' + esc(kv[0]) + '</div><div style="font-weight:700;">' + esc(kv[1]) + '</div></div>';
        }).join('');
      }
      var h = regForm.querySelector('[data-reg-step="' + step + '"] h4');
      if (h) h.focus();
    };

    window.buIcfiRegNext = function (step) {
      if (validateStep(regForm, regForm.querySelector('[data-reg-step="' + step + '"]'), regFiles)) window.buIcfiRegGo(step + 1);
    };

    window.buIcfiCopyActiveAcct = function (btn) { window.buIcfiCopyAcct(btn, computePricing().acct); };

    window.buIcfiPresetReg = function (modeVal, hint) {
      window.buIcfiOpenTab('conference');
      document.getElementById(activeCur === 'USD' ? 'bu-cat-intl' : 'bu-cat-local').checked = true;
      regForm.querySelector('input[name="participationMode"][value="' + modeVal + '"]').checked = true;
      document.getElementById(hint === 'early-bird' && Date.now() > EARLY_BIRD_MS ? 'bu-mem-yes' : 'bu-mem-no').checked = true;
      syncRegUI();
      window.buIcfiRegGo(1);
    };

    window.buIcfiResetReg = function () {
      regForm.reset();
      regFiles.membershipProof = null;
      regFiles.paymentReceipt = null;
      document.getElementById('bu-reg-success').hidden = true;
      regForm.hidden = false;
      syncRegUI();
      window.buIcfiRegGo(1);
    };

    /* --- Send Form Payload + Files to Google Apps Script --- */
    async function sendToEndpoint(payload, btn, busyLabel, readyLabel, fb) {
      btn.disabled = true;
      btn.textContent = busyLabel;
      fb.hidden = true;
      try {
        var r = await fetch(REGISTRATION_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        var j = await r.json();
        if (!j || !j.ok) throw new Error((j && j.error) || 'Could not save submission.');
        return j;
      } catch (err) {
        fb.hidden = false;
        fb.style.background = '#fef2f2';
        fb.style.color = '#991b1b';
        fb.textContent = 'Submission failed: ' + err.message;
        return null;
      } finally {
        btn.disabled = false;
        btn.textContent = readyLabel;
      }
    }

    regForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!validateStep(regForm, regForm.querySelector('[data-reg-step="4"]'), regFiles)) return;
      var p = computePricing();
      var payload = {
        formType: 'conference',
        websiteUrl: regForm.websiteUrl.value,
        participantCategory: p.cat,
        participationMode: p.mode,
        registrationPeriod: p.period,
        membershipStatus: p.mem,
        currency: p.cur,
        applicableFee: p.fee,
        fullName: regForm.fullName.value.trim(),
        email: regForm.email.value.trim(),
        phone: regForm.phone.value.trim(),
        country: regForm.country.value.trim(),
        stateOfResidence: regForm.stateOfResidence.value.trim(),
        organisation: regForm.organisation.value.trim(),
        designation: regForm.designation.value.trim(),
        specialisation: regForm.specialisation.value.trim(),
        amountPaid: regForm.amountPaid.value.trim(),
        paymentDate: regForm.paymentDate.value,
        transactionRef: regForm.transactionRef.value.trim(),
        accountHolderName: regForm.accountHolderName.value.trim(),
        declarationAgreed: document.getElementById('bu-r-decl').checked,
        membershipProof: regFiles.membershipProof,
        paymentReceipt: regFiles.paymentReceipt
      };
      var res = await sendToEndpoint(payload, document.getElementById('bu-reg-submit'), 'Submitting Registration...', 'Submit Registration →', document.getElementById('bu-reg-feedback'));
      if (!res) return;
      regForm.hidden = true;
      document.getElementById('bu-reg-success').hidden = false;
      document.getElementById('bu-reg-suc-id').textContent = res.registrationId || 'Recorded';
      document.getElementById('bu-reg-suc-sum').textContent = payload.fullName + ' • ' + payload.participantCategory + ' • ' + payload.participationMode + ' (' + payload.applicableFee + ')';
      document.getElementById('bu-reg-suc-h').focus();
    });

    /* --- Membership Form Logic --- */
    var mDate = document.getElementById('bu-m-date');
    if (mDate && !mDate.value) mDate.value = new Date().toISOString().slice(0, 10);

    memForm.querySelectorAll('input[name="conditionsChoice"]').forEach(function (r) {
      r.addEventListener('change', function () {
        var g = r.closest('.bu-choice-group');
        if (g) g.classList.remove('has-error');
        var dis = r.value === 'I disagree';
        document.getElementById('bu-mem-disagree-box').hidden = !dis;
        document.getElementById('bu-mem-next-btn').disabled = dis;
      });
    });

    window.buIcfiMemGo = function (step) {
      memForm.querySelectorAll('[data-mem-step]').forEach(function (s) { s.hidden = Number(s.dataset.memStep) !== step; });
      setPills('[data-mem-pill]', 'data-mem-pill', step);
      var h = memForm.querySelector('[data-mem-step="' + step + '"] h4');
      if (h) h.focus();
    };

    window.buIcfiMemNext = function () {
      if (validateStep(memForm, memForm.querySelector('[data-mem-step="1"]'), memFiles)) {
        if (getRadio(memForm, 'conditionsChoice') === 'I agree') window.buIcfiMemGo(2);
      }
    };

    window.buIcfiCopyCell = function () {
      var c = document.getElementById('bu-m-cell').value.trim();
      var w = document.getElementById('bu-m-wa');
      if (c) { w.value = c; syncField(w); }
      w.focus();
    };

    window.buIcfiResetMem = function () {
      memForm.reset();
      memFiles.paymentEvidence = null;
      if (mDate) mDate.value = new Date().toISOString().slice(0, 10);
      document.getElementById('bu-mem-success').hidden = true;
      memForm.hidden = false;
      window.buIcfiMemGo(1);
    };

    memForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!validateStep(memForm, memForm.querySelector('[data-mem-step="2"]'), memFiles)) return;
      var payload = {
        formType: 'membership',
        websiteUrl: memForm.websiteUrl.value,
        conditionsAgreed: 'I agree',
        fullName: memForm.fullName.value.trim(),
        profession: memForm.profession.value.trim(),
        institutionalAddress: memForm.institutionalAddress.value.trim(),
        cellPhone: memForm.cellPhone.value.trim(),
        whatsappContact: memForm.whatsappContact.value.trim(),
        email: memForm.email.value.trim(),
        registrationDate: memForm.registrationDate.value,
        annualFee: 'US$5 / ₦7,000',
        paymentEvidence: memFiles.paymentEvidence
      };
      var res = await sendToEndpoint(payload, document.getElementById('bu-mem-submit'), 'Submitting Application...', 'Submit Membership Application →', document.getElementById('bu-mem-feedback'));
      if (!res) return;
      memForm.hidden = true;
      document.getElementById('bu-mem-success').hidden = false;
      document.getElementById('bu-mem-suc-id').textContent = res.membershipId || 'Recorded';
      document.getElementById('bu-mem-suc-sum').textContent = payload.fullName + ' • ' + payload.profession + ' • ' + payload.email;
      document.getElementById('bu-mem-suc-h').focus();
    });

    syncRegUI();
  })();
</script>
